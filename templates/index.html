<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WC26 Scoreline Predictor</title>
<style>
  :root {
    --bg: #0c0e12;
    --panel: #14171d;
    --panel-2: #1b1f27;
    --line: #262b34;
    --text: #e6e9ef;
    --muted: #8a93a3;
    --accent: #3ddc97;
    --accent-dim: #1f3a30;
    --grey: #3a4150;
    --bar: #2a64ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 18px 24px; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; background: rgba(12,14,18,.92);
    backdrop-filter: blur(8px); z-index: 10;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  header .ts { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  button:hover { border-color: var(--accent); }
  button.refresh { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .filters {
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
    padding: 14px 24px; border-bottom: 1px solid var(--line);
  }
  .filters input[type=search] {
    background: var(--panel); border: 1px solid var(--line); color: var(--text);
    padding: 8px 12px; border-radius: 8px; min-width: 240px; font-size: 13px;
  }
  .filters label { color: var(--muted); display: flex; align-items: center; gap: 7px; cursor: pointer; }
  .grid {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 14px; padding: 20px 24px; max-width: 1100px; margin: 0 auto;
  }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px;
  }
  .card .top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .card .teams { font-size: 15px; font-weight: 620; }
  .card .ko { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .badge {
    display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px;
    margin-top: 8px; border: 1px solid transparent;
  }
  .badge.blend { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
  .badge.odds { background: var(--panel-2); color: var(--muted); border-color: var(--grey); }
  .scorelist { margin: 14px 0 8px; display: flex; flex-direction: column; gap: 6px; }
  .score-row { display: grid; grid-template-columns: 42px 1fr 52px; align-items: center; gap: 10px; }
  .score-row .s { font-variant-numeric: tabular-nums; font-weight: 600; }
  .score-row .p { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; }
  .bar { height: 8px; background: var(--panel-2); border-radius: 999px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--bar); border-radius: 999px; }
  .score-row.win .bar > span { background: var(--accent); }
  .score-row.draw .bar > span { background: #c9a227; }
  .foot { color: var(--muted); font-size: 12px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .expand { margin-top: 10px; }
  .expand summary { color: var(--muted); cursor: pointer; font-size: 12px; list-style: none; }
  .expand summary::-webkit-details-marker { display: none; }
  .expand summary::before { content: "▸ "; }
  .expand[open] summary::before { content: "▾ "; }
  .expand pre {
    margin: 8px 0 0; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px; font-size: 11px; color: var(--muted);
    overflow-x: auto; white-space: pre-wrap;
  }
  .empty { color: var(--muted); padding: 40px 24px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>⚽ WC26 Scoreline Predictor</h1>
  <span class="ts" id="ts">loading…</span>
  <div class="spacer"></div>
  <button class="refresh" id="refresh">↻ Refresh</button>
</header>

<div class="filters">
  <input type="search" id="search" placeholder="Filter by team…" autocomplete="off" />
  <span class="ts" id="count"></span>
</div>

<div class="grid" id="grid"></div>

<script>
  let MATCHES = [];

  const fmtKO = (iso) => {
    if (!iso) return "TBD";
    try { return new Date(iso).toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" }); }
    catch { return iso; }
  };
  const outClass = (o) => o === "Home Win" || o === "Away Win" ? "win" : "draw";
  const esc = (s) => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

  function cardHTML(m) {
    const blended = m.prediction && m.prediction.blend_applied;
    const badge = blended
      ? `<span class="badge blend">Elevenify blend applied</span>`
      : `<span class="badge odds">Odds only</span>`;

    let body = `<div class="empty" style="padding:12px">No 1X2 + totals market — can't model.</div>`;
    if (m.prediction) {
      const top5 = m.prediction.top_scorelines.slice(0, 5);
      const max = Math.max(...top5.map(s => s.probability), 0.0001);
      const rows = top5.map(s => `
        <div class="score-row ${outClass(s.outcome)}">
          <span class="s">${s.score}</span>
          <span class="bar"><span style="width:${(s.probability / max * 100).toFixed(1)}%"></span></span>
          <span class="p">${s.probability.toFixed(1)}%</span>
        </div>`).join("");
      body = `
        <div class="scorelist">${rows}</div>
        <div class="foot">xG&nbsp; ${m.prediction.lambda_home} ${esc(m.home_team)} | ${m.prediction.lambda_away} ${esc(m.away_team)}</div>`;
    }

    const raw = {
      odds: m.odds_source,
      elevenify: m.elevenify_source,
    };

    return `
      <div class="card">
        <div class="top">
          <span class="teams">${esc(m.home_team)} <span style="color:var(--muted)">vs</span> ${esc(m.away_team)}</span>
          <span class="ko">${fmtKO(m.commence_time)}</span>
        </div>
        ${badge}
        ${body}
        <details class="expand">
          <summary>raw odds &amp; Elevenify stats</summary>
          <pre>${esc(JSON.stringify(raw, null, 2))}</pre>
        </details>
      </div>`;
  }

  function render() {
    const q = document.getElementById("search").value.trim().toLowerCase();
    const grid = document.getElementById("grid");

    const shown = MATCHES.filter(m => {
      if (!q) return true;
      return (m.home_team + " " + m.away_team).toLowerCase().includes(q);
    });

    document.getElementById("count").textContent =
      `${shown.length} of ${MATCHES.length} matches`;
    grid.innerHTML = shown.length
      ? shown.map(cardHTML).join("")
      : `<div class="empty">No matches.</div>`;
  }

  async function load() {
    const r = await fetch("/api/matches");
    const data = await r.json();
    MATCHES = data.matches || [];
    document.getElementById("ts").textContent = data.updated_at
      ? "updated " + new Date(data.updated_at).toLocaleString()
      : "";
    render();
  }

  async function refresh() {
    const btn = document.getElementById("refresh");
    btn.disabled = true; btn.textContent = "↻ refreshing…";
    try { await fetch("/api/refresh"); await load(); }
    finally { btn.disabled = false; btn.textContent = "↻ Refresh"; }
  }

  document.getElementById("search").addEventListener("input", render);
  document.getElementById("refresh").addEventListener("click", refresh);
  load();
</script>
</body>
</html>
