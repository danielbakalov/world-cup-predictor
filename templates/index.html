<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WC26 Predictor</title>
<style>
  :root {
    --bg: #0c0e12;
    --panel: #14171d;
    --panel-2: #1b1f27;
    --line: #262b34;
    --text: #e6e9ef;
    --muted: #8a93a3;
    --accent: #3ddc97;
    --accent-dim: #1f3a30;
    --grey: #3a4150;
    --bar: #2a64ff;
    --bar-dim: #0f1a30;
    --gold: #c9a227;
    --gold-dim: #2a200a;
    --red: #e57373;
    --red-dim: #2a1010;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 18px 24px; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; background: rgba(12,14,18,.92);
    backdrop-filter: blur(8px); z-index: 10;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  header .ts { color: var(--muted); font-size: 12px; }
  header .pts { color: var(--accent); font-size: 13px; font-weight: 600; }
  header .spacer { flex: 1; }
  header .quota { font-size: 12px; color: var(--muted); }
  header .quota.warn { color: var(--gold); }
  header .quota.low { color: var(--red); }
  button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  button:hover { border-color: var(--accent); }
  button.refresh { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

  /* Filters */
  .filters {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 14px 24px; border-bottom: 1px solid var(--line);
  }
  .filters input[type=search] {
    background: var(--panel); border: 1px solid var(--line); color: var(--text);
    padding: 8px 12px; border-radius: 8px; min-width: 220px; font-size: 13px;
  }
  .filters .sep { color: var(--line); }
  .filters .count { color: var(--muted); font-size: 12px; margin-left: 4px; }

  /* Grid */
  .grid {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 14px; padding: 20px 24px; max-width: 1100px; margin: 0 auto;
  }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
  .day-header {
    grid-column: 1 / -1; margin: 6px 0 0; padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
    color: var(--muted); font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .day-header:first-child { margin-top: 0; }

  /* Card */
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px;
  }
  .card .top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .card .teams { font-size: 15px; font-weight: 620; }
  .card .ko { color: var(--muted); font-size: 12px; white-space: nowrap; }

  /* Source badge */
  .badge {
    display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px;
    margin-top: 8px; border: 1px solid transparent;
  }
  .badge.blend { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
  .badge.odds { background: var(--panel-2); color: var(--muted); border-color: var(--grey); }
  .badge.round { background: var(--gold-dim); color: var(--gold); border-color: var(--gold); margin-top: 0; }

  /* Model pick badge */
  .pick-row { margin: 12px 0 10px; display: flex; align-items: center; gap: 8px; }
  .pick-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 11px; border-radius: 7px; font-size: 13px; font-weight: 650; border: 1px solid;
    letter-spacing: .1px;
  }
  .pick-badge.home { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
  .pick-badge.draw { background: var(--gold-dim); color: var(--gold); border-color: var(--gold); }
  .pick-badge.away { background: var(--bar-dim); color: var(--bar); border-color: var(--bar); }
  .pick-badge .xp { font-weight: 400; opacity: .8; font-size: 12px; }

  /* Outcome probability bars */
  .outcome-section { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .oc-row { display: grid; grid-template-columns: 48px 1fr 40px; align-items: center; gap: 9px; }
  .oc-row .ol { font-size: 11px; color: var(--muted); letter-spacing: .3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .oc-row .op { font-size: 12px; font-variant-numeric: tabular-nums; text-align: right; color: var(--muted); }
  .oc-row.optimal .ol { color: var(--text); font-weight: 650; }
  .oc-row.optimal .op { color: var(--text); font-weight: 650; }
  .oc-row.home-r .bar > span { background: var(--accent); }
  .oc-row.draw-r .bar > span { background: var(--gold); }
  .oc-row.away-r .bar > span { background: var(--bar); }

  /* Shared bar */
  .bar { height: 8px; background: var(--panel-2); border-radius: 999px; overflow: hidden; }
  .bar > span { display: block; height: 100%; border-radius: 999px; }

  /* xG footer */
  .foot { color: var(--muted); font-size: 12px; margin-top: 2px; font-variant-numeric: tabular-nums; }

  /* Expandable sections */
  .expand { margin-top: 10px; }
  .expand summary { color: var(--muted); cursor: pointer; font-size: 12px; list-style: none; }
  .expand summary::-webkit-details-marker { display: none; }
  .expand summary::before { content: "▸ "; }
  .expand[open] summary::before { content: "▾ "; }

  /* Scoreline list inside expand */
  .scorelist { margin: 10px 0 4px; display: flex; flex-direction: column; gap: 5px; }
  .score-row { display: grid; grid-template-columns: 42px 1fr 52px; align-items: center; gap: 10px; }
  .score-row .s { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13px; }
  .score-row .p { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; }
  .score-row.win .bar > span { background: var(--accent); }
  .score-row.draw .bar > span { background: var(--gold); }

  .expand pre {
    margin: 8px 0 0; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px; font-size: 11px; color: var(--muted);
    overflow-x: auto; white-space: pre-wrap;
  }

  .empty { color: var(--muted); padding: 40px 24px; text-align: center; }

  /* ── Results section ───────────────────────────────────────────────── */
  .results-section {
    border-top: 1px solid var(--line);
    padding-top: 4px;
    margin-top: 8px;
  }
  .results-header {
    display: flex; align-items: baseline; gap: 12px;
    padding: 16px 24px 4px; max-width: 1100px; margin: 0 auto;
  }
  .results-header h2 {
    font-size: 14px; font-weight: 650; margin: 0; color: var(--muted);
    letter-spacing: .4px; text-transform: uppercase;
  }
  .results-header .pts-total {
    font-size: 13px; color: var(--accent); font-weight: 600;
  }

  /* Result card score display */
  .result-score {
    display: flex; align-items: center; justify-content: center;
    gap: 16px; margin: 14px 0 10px;
  }
  .result-score .team-name {
    font-size: 12px; color: var(--muted); text-align: center;
    max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .result-score .score-val {
    font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums;
    letter-spacing: -1px; color: var(--text); white-space: nowrap;
  }
  .result-score .score-sep { font-size: 20px; color: var(--grey); margin: 0 2px; }

  /* Points chip */
  .pts-chip {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 36px; padding: 3px 8px; border-radius: 6px; font-size: 13px;
    font-weight: 700; border: 1px solid; letter-spacing: .2px;
  }
  .pts-chip.gold { background: var(--gold-dim); color: var(--gold); border-color: var(--gold); }
  .pts-chip.green { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
  .pts-chip.red { background: var(--red-dim); color: var(--red); border-color: var(--red); }
  .pts-chip.grey { background: var(--panel-2); color: var(--muted); border-color: var(--grey); }

  /* Actual outcome label */
  .result-outcome {
    font-size: 12px; color: var(--muted); margin-top: 4px;
  }
  .result-outcome.correct { color: var(--accent); }
  .result-outcome.wrong { color: var(--red); }
</style>
</head>
<body>
<header>
  <h1>⚽ WC26 Predictor</h1>
  <span class="ts" id="ts">loading…</span>
  <span class="pts" id="pts" style="display:none">— <span id="pts-val">0</span> pts</span>
  <div class="spacer"></div>
  <span class="quota" id="quota"></span>
  <button class="refresh" id="refresh" data-scope="odds" title="Refresh odds + blend (~3 API calls)">↻ Odds</button>
  <button class="refresh" id="refresh-scores" data-scope="scores" title="Sync completed results (~2 API calls)">⚑ Scores</button>
</header>

<div class="filters">
  <input type="search" id="search" placeholder="Filter by team…" autocomplete="off" />
  <span class="sep">|</span>
  <span class="count" id="count"></span>
</div>

<div class="grid" id="grid"></div>

<section class="results-section" id="results-section" style="display:none">
  <div class="results-header">
    <h2>Results</h2>
    <span class="pts-total" id="pts-total"></span>
  </div>
  <div class="grid" id="results-grid"></div>
</section>

<script>
  let MATCHES = [];
  let COMPLETED = [];

  const fmtKO = (iso) => {
    if (!iso) return "TBD";
    try {
      return new Date(iso).toLocaleString([], {
        month: "short", day: "numeric", weekday: "short",
        hour: "2-digit", minute: "2-digit"
      });
    } catch { return iso; }
  };

  const ROUND_LABELS = {
    group: "Group Stage", r32: "Round of 32", r16: "Round of 16",
    qf: "Quarter-Final", sf: "Semi-Final", third: "Third Place", final: "Final",
  };
  const ROUND_WIN_PTS = { group: 1, r32: 2, r16: 2, qf: 3, sf: 5, third: 5, final: 10 };
  const roundBadge = (r) => {
    if (!r || !ROUND_LABELS[r]) return "";
    const pts = ROUND_WIN_PTS[r];
    const sub = r === "group" ? "1 pt win · 2 draw" : `${pts} pt${pts !== 1 ? "s" : ""} win`;
    return `<span class="badge round">${ROUND_LABELS[r]} · ${sub}</span>`;
  };

  const outClass = (o) => o === "Home Win" || o === "Away Win" ? "win" : "draw";
  const esc = (s) => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  // ── Quota display ──────────────────────────────────────────────────
  function updateQuota(quota) {
    const el = document.getElementById("quota");
    if (quota === null || quota === undefined || quota < 0) { el.textContent = ""; return; }
    el.textContent = `${quota} API calls left`;
    el.className = "quota" + (quota < 50 ? " low" : quota < 150 ? " warn" : "");
  }

  // ── Model pick section (upcoming cards) ───────────────────────────
  function modelPickSection(pred, homeTeam, awayTeam) {
    const o = pred.outcomes;
    const optLow = o.optimal_pick.toLowerCase();
    const maxPct = Math.max(o.home, o.draw, o.away, 0.001);

    const rows = [
      { key: "home", label: "Home", pct: o.home },
      { key: "draw", label: "Draw", pct: o.draw },
      { key: "away", label: "Away", pct: o.away },
    ].filter(r => !(pred.knockout && r.key === "draw")).map(r => {
      const isOpt = r.key === optLow;
      return `
        <div class="oc-row ${r.key}-r${isOpt ? " optimal" : ""}">
          <span class="ol">${esc(r.label)}</span>
          <span class="bar"><span style="width:${(r.pct / maxPct * 100).toFixed(1)}%"></span></span>
          <span class="op">${r.pct.toFixed(1)}%</span>
        </div>`;
    }).join("");

    const pickLabel = optLow === "home" ? esc(homeTeam)
      : optLow === "away" ? esc(awayTeam)
      : "Draw";

    return `
      <div class="pick-row">
        <span class="pick-badge ${optLow}">Pick: ${pickLabel} <span class="xp">· ${o.expected_points.toFixed(2)} exp pts</span></span>
      </div>
      <div class="outcome-section">${rows}</div>`;
  }

  // ── Upcoming card ──────────────────────────────────────────────────
  function cardHTML(m) {
    const badge = m.prediction && !m.prediction.blend_applied
      ? `<span class="badge odds">Odds only</span>`
      : ``;

    let body = `<div class="empty" style="padding:12px">No 1X2 + totals market — can't model.</div>`;
    if (m.prediction) {
      const pred = m.prediction;

      const modelPick = modelPickSection(pred, m.home_team, m.away_team);
      const foot = `<div class="foot">xG&nbsp; ${pred.lambda_home} ${esc(m.home_team)} | ${pred.lambda_away} ${esc(m.away_team)}</div>`;

      const top5 = pred.top_scorelines.slice(0, 5);
      const maxP = Math.max(...top5.map(s => s.probability), 0.0001);
      const scoreRows = top5.map(s => `
        <div class="score-row ${outClass(s.outcome)}">
          <span class="s">${s.score}</span>
          <span class="bar"><span style="width:${(s.probability / maxP * 100).toFixed(1)}%"></span></span>
          <span class="p">${s.probability.toFixed(1)}%</span>
        </div>`).join("");

      body = `
        ${modelPick}
        ${foot}
        <details class="expand">
          <summary>top scorelines</summary>
          <div class="scorelist">${scoreRows}</div>
        </details>`;
    }

    const raw = { odds: m.odds_source, elevenify: m.elevenify_source };

    return `
      <div class="card">
        <div class="top">
          <span class="teams">${esc(m.home_team)} <span style="color:var(--muted)">vs</span> ${esc(m.away_team)}</span>
          <span class="ko">${fmtKO(m.commence_time)}</span>
        </div>
        ${roundBadge(m.round)}
        ${badge}
        ${body}
        <details class="expand">
          <summary>raw odds &amp; Elevenify stats</summary>
          <pre>${esc(JSON.stringify(raw, null, 2))}</pre>
        </details>
      </div>`;
  }

  // ── Result card (completed matches) ───────────────────────────────
  function resultCardHTML(m) {
    // Score display
    const scoreHTML = `
      <div class="result-score">
        <span class="team-name">${esc(m.home_team)}</span>
        <span class="score-val">${m.home_score ?? "?"} <span class="score-sep">–</span> ${m.away_score ?? "?"}</span>
        <span class="team-name">${esc(m.away_team)}</span>
      </div>`;

    // Points chip — round-aware (group win 1 / draw 2; knockout 2/3/5/10).
    const pe = m.points_earned;
    const hasResult = m.home_score !== null && m.away_score !== null;
    // A knockout tie (penalties) scores null until a winner is recorded manually.
    const pending = pe === null && hasResult && m.round !== "group";
    let chipHTML = pending
      ? `<span class="pts-chip grey">pending</span>`
      : `<span class="pts-chip grey">—</span>`;
    if (pe === 0) chipHTML = `<span class="pts-chip red">✗</span>`;
    else if (pe === 1) chipHTML = `<span class="pts-chip green">+1</span>`;
    else if (pe >= 2) chipHTML = `<span class="pts-chip gold">+${pe}</span>`;

    // Pick + actual outcome row
    let pickActualHTML = "";
    if (m.prediction) {
      const o = m.prediction.outcomes;
      const optLow = o.optimal_pick.toLowerCase();
      const pickLabel = optLow === "home" ? esc(m.home_team)
        : optLow === "away" ? esc(m.away_team)
        : "Draw";

      const actualLabel = pending ? "Level — record winner in .results_store.json"
        : m.actual_outcome === "home" ? esc(m.home_team) + " Win"
        : m.actual_outcome === "away" ? esc(m.away_team) + " Win"
        : m.actual_outcome === "draw" ? "Draw"
        : "—";

      const correct = pe !== null && pe > 0;
      const outcomeClass = pe === null ? "" : correct ? "correct" : "wrong";
      const mark = pe === null ? "" : correct ? " ✓" : " ✗";

      pickActualHTML = `
        <div class="pick-row">
          <span class="pick-badge ${optLow}">Pick: ${pickLabel} <span class="xp">· ${o.expected_points.toFixed(2)} exp pts</span></span>
          ${chipHTML}
        </div>
        <div class="result-outcome ${outcomeClass}">Actual: ${actualLabel}${mark}</div>`;
    } else {
      pickActualHTML = `
        <div class="pick-row">${chipHTML}</div>
        <div class="result-outcome">No prediction stored</div>`;
    }

    // Collapsible model detail (probability bars + scorelines)
    let modelDetail = "";
    if (m.prediction) {
      const pred = m.prediction;
      const o = pred.outcomes;
      const optLow = o.optimal_pick.toLowerCase();
      const maxPct = Math.max(o.home, o.draw, o.away, 0.001);
      const bars = [
        { key: "home", label: "Home", pct: o.home },
        { key: "draw", label: "Draw", pct: o.draw },
        { key: "away", label: "Away", pct: o.away },
      ].filter(r => !(pred.knockout && r.key === "draw")).map(r => `
        <div class="oc-row ${r.key}-r${r.key === optLow ? " optimal" : ""}">
          <span class="ol">${r.label}</span>
          <span class="bar"><span style="width:${(r.pct / maxPct * 100).toFixed(1)}%"></span></span>
          <span class="op">${r.pct.toFixed(1)}%</span>
        </div>`).join("");

      const top5 = pred.top_scorelines.slice(0, 5);
      const maxP = Math.max(...top5.map(s => s.probability), 0.0001);
      const scoreRows = top5.map(s => `
        <div class="score-row ${outClass(s.outcome)}">
          <span class="s">${s.score}</span>
          <span class="bar"><span style="width:${(s.probability / maxP * 100).toFixed(1)}%"></span></span>
          <span class="p">${s.probability.toFixed(1)}%</span>
        </div>`).join("");

      modelDetail = `
        <details class="expand">
          <summary>pre-match model</summary>
          <div class="outcome-section" style="margin-top:8px">${bars}</div>
          <div class="foot">xG&nbsp; ${pred.lambda_home} ${esc(m.home_team)} | ${pred.lambda_away} ${esc(m.away_team)}</div>
          <div class="scorelist" style="margin-top:8px">${scoreRows}</div>
        </details>`;
    }

    return `
      <div class="card">
        <div class="top">
          <span class="teams">${esc(m.home_team)} <span style="color:var(--muted)">vs</span> ${esc(m.away_team)}</span>
          <span class="ko">${fmtKO(m.commence_time)}</span>
        </div>
        ${roundBadge(m.round)}
        ${scoreHTML}
        ${pickActualHTML}
        ${modelDetail}
      </div>`;
  }

  function filterMatches(list) {
    const q = document.getElementById("search").value.trim().toLowerCase();
    return list.filter(m => {
      if (q && !(m.home_team + " " + m.away_team).toLowerCase().includes(q)) return false;
      return true;
    });
  }

  const dayLabel = (iso) => {
    if (!iso) return "Date TBD";
    try {
      return new Date(iso).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
    } catch { return "Date TBD"; }
  };

  // ── Main render ────────────────────────────────────────────────────
  function render() {
    // Upcoming — chronological, split under a header per kickoff day.
    const shown = filterMatches(MATCHES).sort((a, b) => {
      if (!a.commence_time) return 1;
      if (!b.commence_time) return -1;
      return new Date(a.commence_time) - new Date(b.commence_time);
    });
    const grid = document.getElementById("grid");
    if (shown.length) {
      let html = "", lastDay = null;
      for (const m of shown) {
        const day = dayLabel(m.commence_time);
        if (day !== lastDay) {
          html += `<div class="day-header">${esc(day)}</div>`;
          lastDay = day;
        }
        html += cardHTML(m);
      }
      grid.innerHTML = html;
    } else {
      grid.innerHTML = `<div class="empty">No upcoming matches.</div>`;
    }

    // Results
    const shownCompleted = filterMatches(COMPLETED).sort((a, b) => {
      if (!a.commence_time) return 1;
      if (!b.commence_time) return -1;
      return new Date(b.commence_time) - new Date(a.commence_time); // newest first
    });
    const resultsSection = document.getElementById("results-section");
    const resultsGrid = document.getElementById("results-grid");
    if (shownCompleted.length > 0) {
      resultsSection.style.display = "";
      resultsGrid.innerHTML = shownCompleted.map(resultCardHTML).join("");
    } else {
      resultsSection.style.display = "none";
    }

    const totalShown = shown.length + shownCompleted.length;
    const totalAll = MATCHES.length + COMPLETED.length;
    document.getElementById("count").textContent =
      `${totalShown} of ${totalAll} matches`;
  }

  // ── Load ───────────────────────────────────────────────────────────
  async function load() {
    const r = await fetch("/api/matches");
    const data = await r.json();
    MATCHES = data.matches || [];
    COMPLETED = data.completed || [];
    updateQuota(data.odds_quota);
    document.getElementById("ts").textContent = data.updated_at
      ? "updated " + new Date(data.updated_at).toLocaleString()
      : "";

    const ptsEl = document.getElementById("pts");
    const ptsVal = document.getElementById("pts-val");
    const totalPts = data.total_points ?? 0;
    const ptsTotal = document.getElementById("pts-total");
    if (COMPLETED.length > 0) {
      ptsEl.style.display = "";
      ptsVal.textContent = totalPts;
      ptsTotal.textContent = `${totalPts} pt${totalPts !== 1 ? "s" : ""}`;
    } else {
      ptsEl.style.display = "none";
      ptsTotal.textContent = "";
    }

    render();
  }

  async function refresh(btn) {
    const scope = btn.dataset.scope;
    const label = btn.textContent;
    btn.disabled = true; btn.textContent = "↻ …";
    try {
      const r = await fetch(`/api/refresh?scope=${scope}`);
      const data = await r.json();
      updateQuota(data.odds_quota);
      await load();
      // Surface a guard skip so a no-op click isn't mistaken for a refresh.
      if (scope !== "scores" && (data.odds_action === "debounced" || data.odds_action === "quota_floor")) {
        btn.textContent = data.odds_action === "debounced" ? "⏳ too soon" : "⛔ low quota";
        await new Promise(res => setTimeout(res, 1500));
      }
    } finally {
      btn.disabled = false; btn.textContent = label;
    }
  }

  document.getElementById("search").addEventListener("input", render);
  document.querySelectorAll("button.refresh").forEach(b =>
    b.addEventListener("click", () => refresh(b)));

  load();
</script>
</body>
</html>
